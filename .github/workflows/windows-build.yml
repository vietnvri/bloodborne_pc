name: Windows package
# Builds the Windows package the way packaging/windows/README.md describes, on a GitHub
# Windows runner: MSYS2 CLANG64 toolchain, bash build.sh, the FSR 4 assets, the DLSS bridge
# (MSVC, when the NVIDIA SDK checkout works) and packaging/windows/package.sh. The result,
# dist/bbport-windows.zip, is the workflow's artifact.

on:
  workflow_dispatch:
  push:
    branches:
      - port-darkizuku-mouse

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 CLANG64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json

      - name: Build bb-probe.exe (bash build.sh)
        shell: msys2 {0}
        run: |
          set +e
          bash build.sh
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "===== out/gpu-build.log (tail) ====="
            tail -n 200 out/gpu-build.log || true
            exit "$rc"
          fi
          ls -l out/bb-probe.exe out/bb-gpu-capabilities.exe out/bb-play.exe

      - name: Menu pointer test
        shell: msys2 {0}
        run: |
          ninja -C out/gpu menu-pointer-test
          out/gpu/menu-pointer-test.exe

      - name: Python tests (launcher defaults, FOV, run settings)
        shell: msys2 {0}
        continue-on-error: true
        run: |
          cd tests
          python test_input_defaults.py
          python test_fov.py
          python test_run_settings.py

      - name: Fetch FSR 4 v07 assets
        shell: msys2 {0}
        continue-on-error: true
        run: bash tools/fetch_fsr4_assets.sh

      # packaging/windows/build_dlss.sh, step by step: the MSVC of whatever Visual Studio the
      # runner image has (2026 today; the VS 2022 generator is not there), through Ninja.
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: DLSS bridge (NVIDIA SDK, MSVC)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 --filter=blob:none --sparse https://github.com/NVIDIA/DLSS out/dlss-sdk
          git -C out/dlss-sdk sparse-checkout set include lib/Windows_x86_64/rel lib/Windows_x86_64/x64
          $root = (Get-Location).Path
          $msys = "${{ steps.msys2.outputs.msys2-location }}"
          New-Item -ItemType Directory -Force "$root/out/vkinclude" | Out-Null
          Copy-Item -Recurse -Force "$msys/clang64/include/vulkan" "$root/out/vkinclude/"
          Copy-Item -Recurse -Force "$msys/clang64/include/vk_video" "$root/out/vkinclude/"
          cmake -S gpu/dlss_bridge -B out/dlss-bridge -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DDLSS_SDK_ROOT="$root/out/dlss-sdk" -DVULKAN_INCLUDE="$root/out/vkinclude"
          cmake --build out/dlss-bridge --config Release
          Copy-Item out/dlss-bridge/bbport_dlss.dll out/
          Copy-Item out/dlss-sdk/lib/Windows_x86_64/rel/nvngx_dlss.dll out/
          Copy-Item out/dlss-sdk/lib/Windows_x86_64/rel/nvngx_dlssg.dll out/
          Copy-Item out/dlss-sdk/LICENSE.txt out/NVIDIA-DLSS-LICENSE.txt
          Get-ChildItem out/bbport_dlss.dll, out/nvngx_dlss.dll, out/nvngx_dlssg.dll

      - name: Windows Python for the frozen launcher
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package (packaging/windows/package.sh)
        shell: msys2 {0}
        run: |
          export WINPYTHON="$(cygpath -u "${{ steps.python.outputs.python-path }}")"
          bash packaging/windows/package.sh
          ls -l dist/bbport-windows.zip

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: bbport-windows
          path: dist/bbport-windows.zip
          if-no-files-found: error

      - name: Upload bb-probe.exe with symbols (crash reports)
        uses: actions/upload-artifact@v4
        with:
          name: bb-probe-symbols
          path: |
            out/bb-probe.exe
            out/gpu-build.log
