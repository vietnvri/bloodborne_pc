# bbport input (shadPS4 syntax: output = input, one input per line). Shipped with the Windows
# package: the keyboard and mouse layout bbhost and DarkIzuku's port use by default (Dark Souls
# III's shape on Bloodborne's buttons), with mouse look on and the direct 1:1 camera. Delete
# this file to get bbport's own default layout (docs/INPUT.md), or change it on the launcher's
# Controls page. F7 toggles the mouse, F8 reloads this file.

# Movement: WASD, Left Alt held to walk. Space dodges (tap) and sprints (hold); Q locks on.
axis_left_x_minus = a
axis_left_x_plus = d
axis_left_y_minus = w
axis_left_y_plus = s
leftjoystick_halfmode = lalt
circle = space
r3 = q
l3 = lctrl

# Camera: the mouse (direct, 1:1), or I J K L without it.
axis_right_x_minus = j
axis_right_x_plus = l
axis_right_y_minus = i
axis_right_y_plus = k
mouse_to_joystick = right
mouse_camera = direct
# bbhost's sensitivity 5 (0.25 degrees a count): 1.0 here is 900 counts a radian.
mouse_camera_sensitivity = 3.9
mouse_camera_sync = on
mouse_movement_params = 0.5, 1, 0.125

# Combat: left click attacks (R1), Shift + left click or V the strong attack (R2),
# C or the middle button transforms the weapon (L1), X or right click the firearm (L2).
r1 = leftbutton
r2 = lshift, leftbutton
r2 = v
l1 = c
l1 = middlebutton
l2 = x
l2 = rightbutton

# Items: R drinks a Blood Vial (Triangle), F uses the quick item (Square), E interacts (Cross).
triangle = r
square = f
cross = e

# D-pad: the arrow keys (items down, weapons left and right).
pad_up = up
pad_down = down
pad_left = left
pad_right = right

# Menus: Escape opens the game menu; Enter confirms and Backspace goes back (the US and
# European discs' Cross and Circle); G gestures, T personal effects (the touchpad's halves).
options = escape
cross = enter
circle = backspace
touchpad_left = g
touchpad_right = t

# Controller
cross = cross
circle = circle
square = square
triangle = triangle
l1 = l1
r1 = r1
l2 = l2
r2 = r2
l3 = l3
r3 = r3
options = options
touchpad_left = back
pad_up = pad_up
pad_down = pad_down
pad_left = pad_left
pad_right = pad_right
axis_left_x = axis_left_x
axis_left_y = axis_left_y
axis_right_x = axis_right_x
axis_right_y = axis_right_y

# Hotkeys
hotkey_toggle_mouse_to_joystick = f7
hotkey_reload_inputs = f8
